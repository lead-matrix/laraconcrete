<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9636" />
      <stop offset="50%" stop-color="#F58220" />
      <stop offset="100%" stop-color="#D96808" />
    </linearGradient>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3F45" />
      <stop offset="100%" stop-color="#1E2022" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E97A0" />
      <stop offset="100%" stop-color="#5A626A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Dark Charcoal Hexagon -->
  <polygon points="256,32 448,144 448,368 256,480 64,368 64,144" fill="url(#charcoalGrad)" filter="url(#shadow)" />

  <!-- Middle Steel Gray Layer -->
  <polygon points="256,80 400,164 400,348 256,432 112,348 112,164" fill="url(#steelGrad)" />

  <!-- Inner Dark Core background -->
  <polygon points="256,128 352,184 352,328 256,384 160,328 160,184" fill="#1A1D20" />

  <!-- Iconic Orange 'C' Mark -->
  <path d="M 330 200 L 256 156 L 192 192 L 192 320 L 256 356 L 330 312 L 330 270 L 290 290 L 256 310 L 232 296 L 232 216 L 256 202 L 290 222 Z" fill="url(#orangeGrad)" />
</svg>